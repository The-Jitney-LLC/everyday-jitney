# One-click back end on Render (render.com > New > Blueprint > pick this repo).
services:
  - type: web
    name: everyday-jitney-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SITE_URL
        value: https://www.everydayjitney.com
      - key: ALLOWED_ORIGINS
        value: https://www.everydayjitney.com,https://everydayjitney.com
      - key: SHOPIFY_STORE_DOMAIN
        value: sihxha-06.myshopify.com
      - key: MAKE_ORDERS_WEBHOOK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_AUTOMATIC_TAX
        value: "false"
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: MAKE_SALES_WEBHOOK_URL
        sync: false
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
      - key: MAKE_ICP_WEBHOOK_URL
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
